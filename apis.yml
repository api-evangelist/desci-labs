aid: desci-labs
name: DeSci Labs
description: >-
  DeSci Labs builds decentralized-science infrastructure for open, verifiable, and AI-native
  scholarly communication. Its products include DeSci Publish (DeSci Nodes) — a preprint and
  open-access publishing platform with rapid peer review and versioned, PID-addressed research
  objects; SciWeave — an AI research-discovery engine over 300M+ scientific works that ships a
  hosted Model Context Protocol (MCP) server; the DeSci Referee Finder for editorial reviewer
  matching; and the open-source dPID Resolver, an HTTP API that bridges decentralized persistent
  identifiers (dPIDs) to IPFS content and the Ceramic network. Developers integrate via the
  @desci-labs/nodes-lib client library and the public dPID Resolver API. Backed by hv-capital.
